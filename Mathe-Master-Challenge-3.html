<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathe-Master Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom": "https://esm.sh/react-dom@^19.2.3",
        "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React, { useState, useEffect, useCallback, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        import { GoogleGenAI } from "@google/genai";

        // --- MATH SERVICE LOGIC ---
        const generateProblem = (level) => {
          let maxA = 10, maxB = 10;
          if (level > 1) { const inc = level - 1; maxA += Math.floor(inc/2); maxB += Math.ceil(inc/2); }
          const minA = level > 5 ? Math.floor(level/2) : 2;
          const minB = 2;
          const a = Math.floor(Math.random() * (maxA - minA + 1)) + minA;
          const b = Math.floor(Math.random() * (maxB - minB + 1)) + minB;
          return { a, b, result: a * b };
        };

        const getExplanation = (a, b) => {
          if (a <= 10 && b <= 10) return "Das gehört zum kleinen Einmaleins.";
          const larger = Math.max(a, b), smaller = Math.min(a, b);
          const tens = Math.floor(larger / 10) * 10, ones = larger % 10;
          return "Zerlege " + larger + ":\n1. " + tens + " × " + smaller + " = " + (tens*smaller) + "\n2. " + ones + " × " + smaller + " = " + (ones*smaller) + "\n3. Summe: " + (tens*smaller + ones*smaller);
        };

        // --- GEMINI SERVICE LOGIC ---
        const getFeedbackMessage = async (isCorrect, level, streak) => {
          try {
            // Hier nutzen wir den Key nur, wenn er verfügbar ist
            const apiKey = "GEMINI_API_KEY";
            if(!apiKey) throw new Error("No Key");
            const ai = new GoogleGenAI({ apiKey });
            const response = await ai.models.generateContent({
              model: 'gemini-3-flash-preview',
              contents: "Kurzer deutscher Lob/Ansporn für " + (isCorrect ? "richtig" : "falsch") + ". Level " + level,
            });
            return response.text.trim();
          } catch(e) {
            return isCorrect ? "Sehr gut!" : "Versuch es nochmal!";
          }
        };

        // --- APP COMPONENT ---
        const App = () => {
          const [state, setState] = useState({
            currentLevel: 1, highScore: 1, points: 0,
            problem: generateProblem(1), userInput: '',
            feedback: 'idle', feedbackMessage: 'Bereit?', streak: 0
          });
          const inputRef = useRef(null);

          useEffect(() => {
            const h = localStorage.getItem('m-h');
            const p = localStorage.getItem('m-p');
            if(h) setState(s => ({...s, highScore: parseInt(h), points: p ? parseInt(p) : 0}));
          }, []);

          useEffect(() => { inputRef.current?.focus(); }, [state.problem, state.feedback]);

          const submit = async (e) => {
            e?.preventDefault();
            if(!state.userInput) return;
            const correct = state.problem.result === parseInt(state.userInput);
            const nextLevel = correct ? state.currentLevel + 1 : Math.max(1, state.currentLevel - 1);
            const msg = await getFeedbackMessage(correct, nextLevel, correct ? state.streak+1 : 0);
            
            const newHigh = Math.max(state.highScore, nextLevel);
            const newPoints = Math.max(0, state.points + (correct ? state.currentLevel * 10 : -5));
            
            localStorage.setItem('m-h', newHigh);
            localStorage.setItem('m-p', newPoints);

            const lastAttempt = correct ? undefined : {
                a: state.problem.a, b: state.problem.b, 
                correct: state.problem.result, user: state.userInput,
                explanation: getExplanation(state.problem.a, state.problem.b)
            };

            setState(s => ({
              ...s, currentLevel: nextLevel, highScore: newHigh, points: newPoints,
              problem: generateProblem(nextLevel), userInput: '',
              feedback: correct ? 'success' : 'error', feedbackMessage: msg,
              streak: correct ? s.streak + 1 : 0, lastAttempt
            }));
            setTimeout(() => setState(s => ({...s, feedback: 'idle'})), correct ? 1500 : 5000);
          };

          return React.createElement('div', { className: 'min-h-screen flex flex-col items-center justify-center p-4' },
            React.createElement('div', { className: 'w-full max-w-lg grid grid-cols-3 gap-2 mb-6 bg-white p-5 rounded-3xl shadow-sm border' },
                React.createElement('div', { className: 'flex flex-col items-center border-r' }, 
                    React.createElement('span', {className:'text-[10px] font-bold text-slate-400 uppercase'}, 'Level'),
                    React.createElement('span', {className:'text-2xl font-black text-indigo-600'}, state.currentLevel)
                ),
                React.createElement('div', { className: 'flex flex-col items-center border-r' }, 
                    React.createElement('span', {className:'text-[10px] font-bold text-slate-400 uppercase'}, 'Punkte'),
                    React.createElement('span', {className:'text-2xl font-black text-emerald-500'}, state.points)
                ),
                React.createElement('div', { className: 'flex flex-col items-center' }, 
                    React.createElement('span', {className:'text-[10px] font-bold text-slate-400 uppercase'}, 'Best'),
                    React.createElement('span', {className:'text-2xl font-black text-amber-500'}, state.highScore)
                )
            ),
            React.createElement('div', { className: 'w-full max-w-lg bg-white rounded-[2.5rem] shadow-2xl p-8 flex flex-col items-center relative overflow-hidden ' + (state.feedback === 'success' ? 'ring-4 ring-green-400' : state.feedback === 'error' ? 'ring-4 ring-red-400 animate-shake' : 'border') },
              React.createElement('p', { className: 'mb-4 font-bold ' + (state.feedback === 'success' ? 'text-green-600' : state.feedback === 'error' ? 'text-red-600' : 'text-slate-400') }, state.feedbackMessage),
              React.createElement('div', { className: 'flex items-center gap-4 mb-8' },
                React.createElement('span', { className: 'text-6xl font-black' }, state.problem.a),
                React.createElement('span', { className: 'text-3xl text-slate-300' }, '×'),
                React.createElement('span', { className: 'text-6xl font-black' }, state.problem.b)
              ),
              state.lastAttempt && React.createElement('div', { className: 'w-full mb-6 p-4 bg-red-50 rounded-2xl text-sm animate-fade-in' },
                React.createElement('p', { className: 'font-black text-red-900 mb-1' }, "Lösung: " + state.lastAttempt.correct),
                React.createElement('p', { className: 'text-red-700 whitespace-pre-line' }, state.lastAttempt.explanation)
              ),
              React.createElement('form', { onSubmit: submit, className: 'w-full' },
                React.createElement('input', {
                  ref: inputRef, type: 'number', value: state.userInput,
                  onChange: (e) => setState(s => ({...s, userInput: e.target.value})),
                  placeholder: '?', className: 'w-full text-center text-4xl font-bold py-4 bg-slate-50 rounded-2xl mb-4 border-2 focus:border-indigo-500 outline-none'
                }),
                React.createElement('button', { type: 'submit', className: 'w-full py-4 bg-indigo-600 text-white font-black rounded-2xl shadow-lg' }, 'Bestätigen')
              )
            )
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
