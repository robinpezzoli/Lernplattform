reifen."},{"id":92,"category":"TikTok","scenario":"Du nimmst in der Schulpause ein Tanz-Video für TikTok auf. Im Hintergrund sind deutlich Mitschüler zu sehen, die gerade essen oder sich unterhalten. Was ist der richtige Move vor dem Posten?","options":{"A":"Du postest es einfach, da es ein öffentlicher Raum ist und sie nur zufällig im Bild sind.","B":"Du setzt einen Sticker über die Gesichter der Leute, damit man sie nicht direkt erkennt.","C":"Du fragst die Personen im Hintergrund kurz, ob es für sie okay ist, oder nutzt einen Filter, der den Hintergrund komplett unkenntlich macht."},"correctOption":"C","explanation":"Das 'Recht am eigenen Bild' gilt auch in der Schule. Nur weil jemand im Hintergrund ist, darf er nicht ungefragt auf einer Plattform mit Millionenreichweite landen. Fragen oder Unkenntlichmachen ist Pflicht."},{"id":93,"category":"Discord","scenario":"Auf einem Gaming-Server postet jemand ein Meme, das du ziemlich grenzwertig und beleidigend gegenüber einer Minderheit findest. Die anderen im Chat schreiben 'lol' oder 'safe'. Was tust du?","options":{"A":"Du schreibst sachlich in den Chat, dass du den Witz unpassend findest und erklärst kurz, warum.","B":"Du ignorierst es, um kein 'Spielverderber' zu sein, da es ja nur ein Meme ist.","C":"Du meldest den User direkt beim Support von Discord, ohne vorher etwas zu sagen."},"correctOption":"A","explanation":"Zivilcourage im Netz bedeutet, Grenzen aufzuzeigen. Oft merken Leute gar nicht, dass sie verletzend sind, bis jemand sachlich Kontra gibt. Ein direkter Report ist bei schweren Verstößen gut, aber für die Lernkurve der Community ist ein Kommentar oft effektiver."},{"id":94,"category":"Instagram","scenario":"Eine Mitschülerin postet ein Bild, auf dem sie sich sehr schick gemacht hat. In den Kommentaren fangen einige an, mit 'Overdressed' oder 'Pick-me' zu sticheln. Du willst sie unterstützen.","options":{"A":"Du antwortest den Hatern direkt und beleidigst sie, damit sie sehen, wie das ist.","B":"Du schreibst ein ehrliches Kompliment unter das Bild, um das positive Feedback zu stärken.","C":"Du schreibst ihr eine DM: 'Lösch lieber die Kommentare, das sieht sonst peinlich aus.'"},"correctOption":"B","explanation":"Hater wollen Aufmerksamkeit. Wenn du sie beleidigst, fütterst du den Algorithmus und den Streit. Ein positives Gegengewicht in den Kommentaren hilft der Erstellerin mehr und setzt ein Zeichen für eine gute Feedback-Kultur."},{"id":95,"category":"BeReal","scenario":"Der BeReal-Alarm geht los, während du gerade mit deinen Eltern ein sehr ernstes Gespräch über deine Noten führst. Du willst deinen Streak nicht verlieren.","options":{"A":"Du machst schnell das Foto, achtest aber darauf, dass man nur den Boden sieht.","B":"Du lässt das Handy in der Tasche und postest später ('Late'), wenn die Situation vorbei ist.","C":"Du machst das Foto heimlich unter dem Tisch, um die Echtheit des Moments zu bewahren."},"correctOption":"B","explanation":"Privatsphäre und Respekt gegenüber den Anwesenden gehen vor. BeReal wirbt zwar mit Echtheit, aber private Krisengespräche gehören nicht ins Netz. Ein 'Late BeReal' ist völlig akzeptabel und zeigt digitale Reife."},{"id":96,"category":"Gaming","scenario":"In einer Runde 'Valorant' spielt ein Teammitglied extrem schlecht und verursacht fast die Niederlage. Das Team fängt an, ihn im Voice-Chat hart zu flamen.","options":{"A":"Du sagst: 'Leute, beruhigt euch, Flamen macht ihn auch nicht besser. Fokus aufs Game.'","B":"Du mutest einfach alle, damit du deine Ruhe hast und konzentrierst dich auf dich selbst.","C":"Du schreibst 'Diff' in den All-Chat, damit wenigstens das Gegner-Team weiß, dass du nicht schuld bist."},"correctOption":"A","explanation":"Toxic Behavior zerstört die Team-Moral und führt meistens erst recht zum Loose. Deeskalation hilft, die Konzentration zurückzugewinnen. Muten ist eine Notlösung, aber aktives Eingreifen schützt das Opfer."},{"id":97,"category":"WhatsApp","scenario":"In eurer Klassengruppe wird ein Sticker-Paket geteilt, das Sticker von Lehrern in unvorteilhaften Situationen enthält. Alle feiern es. Wie verhältst du dich?","options":{"A":"Du speicherst die besten Sticker, benutzt sie aber nur in privaten Chats mit engen Freunden.","B":"Du schreibst in die Gruppe, dass das rechtlich problematisch sein kann und man das lieber lassen sollte.","C":"Du verlässt kommentarlos die Gruppe, um damit nichts zu tun zu haben."},"correctOption":"B","explanation":"Das Erstellen und Verbreiten von Stickern ohne Einverständnis (besonders bei Lehrern) kann rechtliche Konsequenzen haben (Recht am eigenen Bild). Ein kurzer Hinweis schützt dich und deine Mitschüler vor Ärger."},{"id":98,"category":"Discord","scenario":"Du bist Admin auf einem kleinen Community-Server. Ein User postet ständig ungefragt Links zu seinem eigenen YouTube-Kanal, obwohl es einen extra Channel für Eigenwerbung gibt.","options":{"A":"Du bannst ihn sofort ohne Vorwarnung, da er die Regeln nicht liest.","B":"Du löschst die Nachrichten und schreibst ihm eine freundliche DM, in der du ihn auf den richtigen Channel hinweist.","C":"Du änderst seinen Nickname in 'Spammer', damit er sieht, dass es nervt."},"correctOption":"B","explanation":"Gute Moderation setzt auf Kommunikation vor Bestrafung. Ein freundlicher Hinweis löst das Problem meistens sofort, ohne die Community-Atmosphäre durch unnötige Härte zu vergiften."},{"id":99,"category":"Instagram","scenario":"Du siehst ein Video von einem Creator, das inhaltlich totalen Quatsch erzählt (Fake News). Du möchtest das richtigstellen.","options":{"A":"Du schreibst: 'Lösch dich, du hast keine Ahnung!'","B":"Du postest einen Kommentar mit einer seriösen Quelle, die die Fakten widerlegt, ohne persönlich zu werden.","C":"Du ignorierst es, weil Korrekturen den Post durch Interaktion nur noch bekannter machen."},"correctOption":"B","explanation":"Sachliche Korrekturen mit Quellen sind der beste Weg gegen Desinformation. Beleidigungen führen nur zu Blockierungen, während Fakten anderen Usern helfen, die Wahrheit zu erkennen."},{"id":100,"category":"Gaming","scenario":"Du hast gerade ein 1vs1 gegen jemanden gewonnen, der dich das ganze Spiel über provoziert hat. Am Ende schreibst du...","options":{"A":"'GG WP' (Good Game, Well Played), um Größe zu zeigen.","B":"'Easy' oder 'L', um es ihm heimzuzahlen.","C":"Gar nichts, du verlässt sofort die Lobby."},"correctOption":"A","explanation":"Sportsmanship (Sportlichkeit) zeigt sich besonders dann, wenn man trotz Provokation höflich bleibt. Ein 'GG' signalisiert, dass du über der Toxizität stehst und nimmt dem Provokateur den Wind aus den Segeln."}];
      var PLATFORMS = ["WhatsApp", "Instagram", "Discord", "TikTok", "Gaming", "BeReal"];
      var PLATFORM_META = {
        WhatsApp: { sub: "Gruppenchats, Ghosting und Direktnachrichten", topics: "Recht am eigenen Bild bei Stickern, respektvolle Kommunikation, Zivilcourage im Klassenchat" },
        Instagram: { sub: "Stories, DMs und Kommentarspalten", topics: "Einverständnis vor dem Posten, Umgang mit Hasskommentaren, Schutz vor Fake-Scouts" },
        Discord: { sub: "Server-Moderation, Voice-Chats und Feedback", topics: "Konstruktive Kritik (Sandwich-Methode), faire Regeln durchsetzen, Scam-Links erkennen" },
        TikTok: { sub: "Öffentlicher Raum, Trends und Algorithmus", topics: "Persönlichkeitsrechte im Hintergrund, Dance Credits, sachliche Gegenrede" },
        Gaming: { sub: "Teamplay, Voice-Chat und Sportsmanship", topics: "Muten und Reporten bei Toxizität, Neulinge unterstützen, Deeskalation und GG WP" },
        BeReal: { sub: "Authentizität versus Privatsphäre", topics: "Empathie in Krisensituationen, Tabuzonen wie Umkleiden, Timing mit Late-Posts" }
      };

      var STORAGE_KEY = "netiquette_master_100_offline_v1";
      var ALL_IDS = QUESTIONS.map(function (q) { return q.id; });
      var memoryAnswers = {};

      function loadAnswers() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return memoryAnswers;
        }
      }

      function saveAnswers(obj) {
        memoryAnswers = obj;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
        } catch (e) {}
      }

      var state = {
        view: "quiz",
        answers: loadAnswers(),
        mode: "all",
        category: "Alle",
        questionIds: ALL_IDS.slice(),
        currentIndex: 0,
        shuffled: false,
        catalogSearch: "",
        catalogPlatform: "Alle",
        catalogStatus: "all",
        showAllSolutions: false,
        expandedIds: {},
        confirmReset: false
      };

      function shuffle(arr) {
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      function esc(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function getQuestion(id) {
        for (var i = 0; i < QUESTIONS.length; i++) {
          if (QUESTIONS[i].id === id) return QUESTIONS[i];
        }
        return null;
      }

      function getOverallStats() {
        var answered = 0, correct = 0, incorrect = 0;
        var list = [];
        for (var i = 0; i < QUESTIONS.length; i++) {
          var r = state.answers[QUESTIONS[i].id];
          if (r) {
            answered++;
            if (r.isCorrect) correct++;
            else incorrect++;
            list.push(r);
          }
        }
        list.sort(function (a, b) { return a.answeredAt - b.answeredAt; });
        var curStreak = 0;
        for (var j = list.length - 1; j >= 0; j--) {
          if (list[j].isCorrect) curStreak++;
          else break;
        }
        var bestStreak = 0, run = 0;
        for (var k = 0; k < list.length; k++) {
          if (list[k].isCorrect) { run++; if (run > bestStreak) bestStreak = run; }
          else run = 0;
        }
        return {
          total: QUESTIONS.length,
          answered: answered,
          correct: correct,
          incorrect: incorrect,
          accuracy: answered > 0 ? Math.round((correct / answered) * 100) : 0,
          completionPct: Math.round((answered / QUESTIONS.length) * 100),
          currentStreak: curStreak,
          bestStreak: bestStreak
        };
      }

      function startMode(mode, category, shouldShuffle) {
        var pool = category === "Alle"
          ? ALL_IDS.slice()
          : QUESTIONS.filter(function (q) { return q.category === category; }).map(function (q) { return q.id; });
        if (mode === "mistakes") {
          pool = pool.filter(function (id) { return !state.answers[id] || !state.answers[id].isCorrect; });
        }
        if (mode === "sprint") {
          var unanswered = pool.filter(function (id) { return !state.answers[id]; });
          pool = shuffle(unanswered.length >= 10 ? unanswered : pool).slice(0, 10);
          shouldShuffle = true;
        } else if (shouldShuffle) {
          pool = shuffle(pool);
        }
        state.mode = mode;
        state.category = category;
        state.questionIds = pool;
        state.currentIndex = 0;
        state.shuffled = Boolean(shouldShuffle);
        state.view = "quiz";
        render();
      }

      function syncNav() {
        var btns = document.querySelectorAll(".nav-btn[data-view]");
        for (var i = 0; i < btns.length; i++) {
          var b = btns[i];
          if (b.getAttribute("data-view") === state.view) b.classList.add("active");
          else b.classList.remove("active");
        }
      }

      function renderQuiz() {
        var overall = getOverallStats();
        var qId = state.questionIds[state.currentIndex];
        var q = qId ? getQuestion(qId) : null;
        var rec = q ? state.answers[q.id] : null;
        var sesAns = state.questionIds.filter(function (id) { return Boolean(state.answers[id]); }).length;
        var sesCor = state.questionIds.filter(function (id) { return state.answers[id] && state.answers[id].isCorrect; }).length;

        var html = "";
        html += "<section class=\"toolbar\">";
        html += "<div class=\"toolbar-row\">";
        html += "<div class=\"segmented\">";
        html += "<button type=\"button\" class=\"seg-btn " + (state.mode === "all" && state.category === "Alle" ? "active" : "") + "\" data-mode=\"all\">Alle 100</button>";
        html += "<button type=\"button\" class=\"seg-btn " + (state.mode === "sprint" ? "active" : "") + "\" data-mode=\"sprint\">10er-Sprint</button>";
        html += "<button type=\"button\" class=\"seg-btn " + (state.mode === "mistakes" ? "active" : "") + "\" data-mode=\"mistakes\">Offen &amp; Fehler</button>";
        html += "</div>";
        html += "<button type=\"button\" id=\"shuffleBtn\" class=\"chip-toggle " + (state.shuffled ? "active" : "") + "\">" + (state.shuffled ? "Gemischt" : "Mischen") + "</button>";
        html += "</div>";

        html += "<div class=\"segmented\">";
        html += "<button type=\"button\" class=\"seg-btn " + (state.category === "Alle" && state.mode !== "sprint" && state.mode !== "mistakes" ? "active" : "") + "\" data-cat=\"Alle\">Alle</button>";
        for (var p = 0; p < PLATFORMS.length; p++) {
          var cat = PLATFORMS[p];
          html += "<button type=\"button\" class=\"seg-btn " + (state.category === cat ? "active" : "") + "\" data-cat=\"" + cat + "\">" + cat + "</button>";
        }
        html += "</div>";
        html += "</section>";

        if (!q) {
          html += "<div class=\"beige-card\" style=\"text-align:center;padding:36px\">";
          html += "<h2 style=\"margin:0;font-size:20px\">Keine offenen oder fehlerhaften Aufgaben vorhanden</h2>";
          html += "<p style=\"color:var(--text-muted);font-size:14px\">Alle Aufgaben in dieser Auswahl sind bereits richtig gelöst.</p>";
          html += "<div style=\"margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap\">";
          html += "<button type=\"button\" class=\"btn-primary\" id=\"openAllBtn\">Alle 100 Aufgaben öffnen</button>";
          html += "<button type=\"button\" class=\"btn-secondary\" id=\"openResBtn\">Auswertung ansehen</button>";
          html += "</div></div>";
          return html;
        }

        html += "<div class=\"quiz-grid\">";
        // Scenario Card
        html += "<div class=\"scenario-card\">";
        html += "<div class=\"meta-row\">";
        html += "<div class=\"meta-left\"><span class=\"mono\" style=\"font-weight:600;color:var(--text)\">Aufgabe " + String(q.id).padStart(2, "0") + " / " + QUESTIONS.length + "</span><span aria-hidden=\"true\">&middot;</span><span style=\"font-weight:600;color:#3F5E4E\">" + esc(q.category) + "</span>" + (state.mode === "sprint" ? "<span aria-hidden=\"true\">&middot;</span><span>10er-Sprint</span>" : "") + "</div>";
        html += "<span class=\"mono\">Schritt " + (state.currentIndex + 1) + " von " + state.questionIds.length + "</span>";
        html += "</div>";

        html += "<h1 class=\"scenario-title\">" + esc(q.scenario) + "</h1>";

        html += "<div class=\"options-list\">";
        var keys = ["A", "B", "C"];
        for (var k = 0; k < keys.length; k++) {
          var key = keys[k];
          var cls = "option-btn";
          var tag = "";
          if (rec) {
            if (rec.selected === key && q.correctOption === key) {
              cls += " correct-selected";
              tag = "<span class=\"option-tag\">&#10003; Richtig</span>";
            } else if (rec.selected === key && q.correctOption !== key) {
              cls += " wrong-selected";
              tag = "<span class=\"option-tag\">&#10005; Deine Wahl</span>";
            } else if (q.correctOption === key) {
              cls += " correct-reveal";
              tag = "<span class=\"option-tag\">&#10003; Lösung</span>";
            } else {
              cls += " dimmed";
            }
          }
          html += "<button type=\"button\" class=\"" + cls + "\" data-opt=\"" + key + "\" " + (rec ? "disabled" : "") + ">";
          html += "<span class=\"option-key mono\">" + key + "</span>";
          html += "<span class=\"option-text\">" + esc(q.options[key]) + "</span>";
          html += tag;
          html += "</button>";
        }
        html += "</div>";

        if (rec) {
          html += "<div class=\"feedback-box\">";
          html += "<div class=\"feedback-head " + (rec.isCorrect ? "ok" : "err") + "\">";
          html += "<span>" + (rec.isCorrect ? "&#10003; Richtig gelöst &mdash; starke Entscheidung" : "&#9888; Nicht optimal &mdash; beste Antwort ist Option " + q.correctOption) + "</span>";
          html += "<button type=\"button\" class=\"retry-link\" id=\"retryOneBtn\">Neu versuchen</button>";
          html += "</div>";
          html += "<p class=\"explanation\">" + esc(q.explanation) + "</p>";
          html += "</div>";
        }

        html += "<div class=\"card-footer\">";
        html += "<button type=\"button\" class=\"btn-secondary\" id=\"prevBtn\" " + (state.currentIndex === 0 ? "disabled" : "") + ">&larr; Vorherige</button>";
        if (state.currentIndex < state.questionIds.length - 1) {
          html += "<button type=\"button\" class=\"btn-primary\" id=\"nextBtn\">Nächste Aufgabe &rarr;</button>";
        } else {
          html += "<button type=\"button\" class=\"btn-primary\" id=\"finishBtn\">Auswertung ansehen &rarr;</button>";
        }
        html += "</div>";
        html += "</div>";

        // Sidebar Deck
        html += "<aside class=\"deck\">";
        html += "<div class=\"deck-card\">";
        html += "<div class=\"deck-head\"><h2 class=\"deck-title\">Dein Fortschritt</h2><span class=\"mono\" style=\"font-size:12px;color:var(--text-muted)\">" + overall.answered + " / " + overall.total + " gesamt</span></div>";
        html += "<div class=\"progress-track\"><div class=\"progress-fill\" style=\"width:" + overall.completionPct + "%\"></div></div>";
        html += "<div class=\"metrics-3\">";
        html += "<div><div class=\"metric-val mono\">" + sesAns + "/" + state.questionIds.length + "</div><div class=\"metric-lbl\">Runde</div></div>";
        html += "<div><div class=\"metric-val mono\" style=\"color:var(--ok-text)\">" + overall.accuracy + "%</div><div class=\"metric-lbl\">Quote</div></div>";
        html += "<div><div class=\"metric-val mono\">" + overall.currentStreak + "</div><div class=\"metric-lbl\">Serie</div></div>";
        html += "</div></div>";

        html += "<div class=\"deck-card\">";
        html += "<div class=\"deck-head\"><h2 class=\"deck-title\">Aufgabenübersicht</h2><span class=\"mono\" style=\"font-size:12px;color:var(--text-muted)\">" + sesCor + " richtig</span></div>";
        html += "<div class=\"matrix " + (state.questionIds.length <= 20 ? "compact" : "") + "\">";
        for (var idx = 0; idx < state.questionIds.length; idx++) {
          var id = state.questionIds[idx];
          var r = state.answers[id];
          var mCls = "m-cell mono";
          if (r && r.isCorrect) mCls += " ok";
          else if (r && !r.isCorrect) mCls += " err";
          if (idx === state.currentIndex) mCls += " current";
          html += "<button type=\"button\" class=\"" + mCls + "\" data-jump-idx=\"" + idx + "\">" + id + "</button>";
        }
        html += "</div>";
        html += "<div class=\"legend\"><span style=\"color:var(--ok-text)\">&#10003; Richtig</span><span style=\"color:var(--err-text)\">&#10005; Falsch</span><span>&#9633; Offen</span></div>";
        html += "</div>";
        html += "<p style=\"margin:0 4px;font-size:12px;color:var(--text-soft)\">Tastatur: A, B, C (oder 1&ndash;3) &middot; Pfeiltasten zum Blättern.</p>";
        html += "</aside>";

        html += "</div>";
        return html;
      }

      function renderPlatforms() {
        var html = "<h1 class=\"page-title\">Sechs digitale Lebenswelten</h1>";
        html += "<p class=\"page-sub\">Wähle eine Plattform aus, um gezielt die dort typischen Netiquette-Situationen zu trainieren.</p>";
        html += "<div class=\"cards-grid\">";
        for (var i = 0; i < PLATFORMS.length; i++) {
          var cat = PLATFORMS[i];
          var meta = PLATFORM_META[cat];
          var items = QUESTIONS.filter(function (q) { return q.category === cat; });
          var ans = 0, cor = 0, err = 0;
          for (var j = 0; j < items.length; j++) {
            var r = state.answers[items[j].id];
            if (r) { ans++; if (r.isCorrect) cor++; else err++; }
          }
          var pct = Math.round((ans / items.length) * 100);
          var acc = ans > 0 ? Math.round((cor / ans) * 100) + "% Quote" : "Noch offen";
          html += "<article class=\"beige-card\"><div>";
          html += "<div class=\"meta-row mono\"><span>" + items.length + " Aufgaben</span><span>" + ans + " / " + items.length + " gelöst</span></div>";
          html += "<h2 style=\"margin:10px 0 4px;font-size:20px\">" + cat + "</h2>";
          html += "<p style=\"margin:0;font-size:14px;font-weight:600;color:#44403C\">" + esc(meta.sub) + "</p>";
          html += "<p style=\"margin:10px 0 0;font-size:14px;color:var(--text-muted)\">" + esc(meta.topics) + "</p>";
          html += "</div><div style=\"margin-top:20px;padding-top:14px;border-top:1px solid #E6DDD0\">";
          html += "<div class=\"meta-row mono\"><span><span style=\"color:var(--ok-text)\">&#10003; " + cor + "</span> &nbsp; <span style=\"color:var(--err-text)\">&#10005; " + err + "</span></span><strong style=\"color:var(--text)\">" + acc + "</strong></div>";
          html += "<div class=\"progress-track\" style=\"height:6px;margin-top:10px\"><div class=\"progress-fill\" style=\"width:" + pct + "%\"></div></div>";
          html += "<button type=\"button\" class=\"btn-secondary\" style=\"width:100%;margin-top:14px\" data-start-cat=\"" + cat + "\">" + cat + " trainieren &rarr;</button>";
          html += "</div></article>";
        }
        html += "</div>";
        return html;
      }

      function renderCatalog() {
        var query = state.catalogSearch.trim().toLowerCase();
        var filtered = QUESTIONS.filter(function (q) {
          if (state.catalogPlatform !== "Alle" && q.category !== state.catalogPlatform) return false;
          var r = state.answers[q.id];
          if (state.catalogStatus === "unanswered" && r) return false;
          if (state.catalogStatus === "correct" && (!r || !r.isCorrect)) return false;
          if (state.catalogStatus === "incorrect" && (!r || r.isCorrect)) return false;
          if (!query) return true;
          if (String(q.id) === query || ("#" + q.id) === query) return true;
          return (
            q.scenario.toLowerCase().indexOf(query) !== -1 ||
            q.category.toLowerCase().indexOf(query) !== -1 ||
            q.explanation.toLowerCase().indexOf(query) !== -1 ||
            q.options.A.toLowerCase().indexOf(query) !== -1 ||
            q.options.B.toLowerCase().indexOf(query) !== -1 ||
            q.options.C.toLowerCase().indexOf(query) !== -1
          );
        });

        var html = "<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px\">";
        html += "<div><h1 class=\"page-title\">Alle 100 Aufgaben &amp; Lösungen</h1><p class=\"page-sub\">Suche nach Stichworten, Plattform oder Bearbeitungsstatus.</p></div>";
        html += "<button type=\"button\" class=\"btn-secondary\" id=\"toggleAllSolBtn\">" + (state.showAllSolutions ? "Lösungen ausblenden" : "Alle Lösungen einblenden") + "</button>";
        html += "</div>";

        html += "<div class=\"beige-card\" style=\"margin-top:18px;gap:12px\">";
        html += "<div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center\">";
        html += "<input type=\"search\" class=\"search-input\" id=\"catSearchInput\" value=\"" + esc(state.catalogSearch) + "\" placeholder=\"Suchen nach Thema, Stichwort oder Nr. ...\" />";
        html += "<div class=\"segmented\">";
        var statuses = [["all", "Alle"], ["unanswered", "Offen"], ["correct", "Richtig"], ["incorrect", "Falsch"]];
        for (var s = 0; s < statuses.length; s++) {
          html += "<button type=\"button\" class=\"seg-btn " + (state.catalogStatus === statuses[s][0] ? "active" : "") + "\" data-cstatus=\"" + statuses[s][0] + "\">" + statuses[s][1] + "</button>";
        }
        html += "</div></div>";
        html += "<div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid #E6DDD0;padding-top:12px\">";
        html += "<div class=\"segmented\">";
        html += "<button type=\"button\" class=\"seg-btn " + (state.catalogPlatform === "Alle" ? "active" : "") + "\" data-cplat=\"Alle\">Alle</button>";
        for (var p = 0; p < PLATFORMS.length; p++) {
          html += "<button type=\"button\" class=\"seg-btn " + (state.catalogPlatform === PLATFORMS[p] ? "active" : "") + "\" data-cplat=\"" + PLATFORMS[p] + "\">" + PLATFORMS[p] + "</button>";
        }
        html += "</div>";
        html += "<span class=\"mono\" style=\"font-size:12px;color:var(--text-muted)\">" + filtered.length + " von " + QUESTIONS.length + " Aufgaben</span>";
        html += "</div></div>";

        for (var i = 0; i < filtered.length; i++) {
          var q = filtered[i];
          var r = state.answers[q.id];
          var open = state.showAllSolutions || Boolean(state.expandedIds[q.id]);
          html += "<article class=\"catalog-item\">";
          html += "<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start\">";
          html += "<div style=\"flex:1;min-width:220px\">";
          html += "<div class=\"meta-left\" style=\"font-size:12px;color:var(--text-muted)\"><strong class=\"mono\" style=\"color:var(--text)\">Aufgabe " + q.id + "</strong><span>&middot;</span><span style=\"color:#3F5E4E;font-weight:600\">" + esc(q.category) + "</span>";
          if (r) {
            html += "<span>&middot;</span><span style=\"font-weight:600;color:" + (r.isCorrect ? "var(--ok-text)" : "var(--err-text)") + "\">" + (r.isCorrect ? "&#10003; Richtig" : "&#10005; Falsch (" + r.selected + ")") + "</span>";
          }
          html += "</div>";
          html += "<h2 style=\"margin:6px 0 0;font-size:16px;font-weight:500;line-height:1.5;max-width:75ch\">" + esc(q.scenario) + "</h2>";
          html += "</div>";
          html += "<div style=\"display:flex;gap:8px;flex-shrink:0\">";
          html += "<button type=\"button\" class=\"btn-secondary\" data-jump-q=\"" + q.id + "\">Im Quiz öffnen</button>";
          if (!state.showAllSolutions) {
            html += "<button type=\"button\" class=\"btn-secondary\" data-expand-q=\"" + q.id + "\">" + (open ? "Weniger" : "Lösung") + "</button>";
          }
          html += "</div></div>";

          if (open) {
            html += "<div style=\"margin-top:14px;padding-top:14px;border-top:1px solid #ECE4D7\">";
            var keys = ["A", "B", "C"];
            for (var k = 0; k < keys.length; k++) {
              var key = keys[k];
              var isCor = q.correctOption === key;
              html += "<div style=\"display:flex;gap:10px;padding:9px 12px;margin-bottom:6px;border-radius:8px;font-size:14px;border:1px solid " + (isCor ? "#8EB89D;background:#E5F0E6;font-weight:600" : "#ECE5D8;background:#F7F2E9;color:var(--text-muted)") + "\">";
              html += "<span class=\"mono\" style=\"font-size:12px\">" + key + ")</span>";
              html += "<span style=\"flex:1\">" + esc(q.options[key]) + "</span>";
              if (isCor) html += "<span style=\"color:var(--ok-text);font-size:12px\">&#10003; Lösung</span>";
              html += "</div>";
            }
            html += "<p style=\"margin:10px 0 0;font-size:14px;color:#44403C;max-width:75ch\"><strong>Erklärung: </strong>" + esc(q.explanation) + "</p>";
            html += "</div>";
          }
          html += "</article>";
        }
        return html;
      }

      function renderResults() {
        var o = getOverallStats();
        var missed = QUESTIONS.filter(function (q) {
          var r = state.answers[q.id];
          return r && !r.isCorrect;
        });

        var html = "<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px\">";
        html += "<div><h1 class=\"page-title\">Deine Auswertung</h1><p class=\"page-sub\">Überblick über deinen Lernstand aus allen 100 Herausforderungen.</p></div>";
        if (!state.confirmReset) {
          html += "<button type=\"button\" class=\"btn-secondary\" id=\"askResetBtn\" " + (o.answered === 0 ? "disabled" : "") + ">Fortschritt zurücksetzen</button>";
        } else {
          html += "<div style=\"display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;border:1px solid #DFA5A1;background:#F9EAE8\">";
          html += "<span style=\"font-size:12px;font-weight:600;color:#7D322E\">Alle Antworten löschen?</span>";
          html += "<button type=\"button\" class=\"btn-primary\" style=\"background:#B95D58;min-height:32px;padding:4px 10px\" id=\"confirmResetBtn\">Löschen</button>";
          html += "<button type=\"button\" class=\"btn-secondary\" style=\"min-height:32px;padding:4px 10px\" id=\"cancelResetBtn\">Abbrechen</button>";
          html += "</div>";
        }
        html += "</div>";

        html += "<div class=\"kpi-grid\">";
        html += "<div class=\"beige-card\"><div style=\"font-size:12px;color:var(--text-soft)\">Beantwortet</div><div class=\"mono\" style=\"font-size:24px;font-weight:700;margin-top:6px\">" + o.answered + " / " + o.total + "</div><div style=\"font-size:12px;color:var(--text-soft)\">" + o.completionPct + "% abgeschlossen</div></div>";
        html += "<div class=\"beige-card\"><div style=\"font-size:12px;color:var(--text-soft)\">Richtig gelöst</div><div class=\"mono\" style=\"font-size:24px;font-weight:700;margin-top:6px;color:var(--ok-text)\">" + o.correct + "</div><div style=\"font-size:12px;color:var(--text-soft)\">" + o.incorrect + " nicht optimal</div></div>";
        html += "<div class=\"beige-card\"><div style=\"font-size:12px;color:var(--text-soft)\">Trefferquote</div><div class=\"mono\" style=\"font-size:24px;font-weight:700;margin-top:6px;color:#3F5E4E\">" + (o.answered > 0 ? o.accuracy + "%" : "—") + "</div><div style=\"font-size:12px;color:var(--text-soft)\">Gelöste Fragen</div></div>";
        html += "<div class=\"beige-card\"><div style=\"font-size:12px;color:var(--text-soft)\">Beste Serie</div><div class=\"mono\" style=\"font-size:24px;font-weight:700;margin-top:6px\">" + o.bestStreak + "</div><div style=\"font-size:12px;color:var(--text-soft)\">Aktuell: " + o.currentStreak + "</div></div>";
        html += "</div>";

        html += "<div class=\"catalog-item\" style=\"margin-top:22px;padding:24px\"><h2 style=\"margin:0 0 16px;font-size:18px\">Kompetenz nach Plattform</h2>";
        for (var i = 0; i < PLATFORMS.length; i++) {
          var cat = PLATFORMS[i];
          var items = QUESTIONS.filter(function (q) { return q.category === cat; });
          var ans = 0, cor = 0, err = 0;
          for (var j = 0; j < items.length; j++) {
            var r = state.answers[items[j].id];
            if (r) { ans++; if (r.isCorrect) cor++; else err++; }
          }
          var pctCor = (cor / items.length) * 100;
          var pctErr = (err / items.length) * 100;
          html += "<div style=\"margin-bottom:14px\"><div class=\"meta-row\"><strong style=\"font-size:14px;color:var(--text)\">" + cat + "</strong><span class=\"mono\">" + ans + "/" + items.length + " (" + (ans > 0 ? Math.round((cor / ans) * 100) + "%" : "—") + ")</span></div>";
          html += "<div style=\"height:8px;border-radius:999px;background:#EAE2D4;overflow:hidden;display:flex;margin-top:6px\"><div style=\"background:#669679;width:" + pctCor + "%\"></div><div style=\"background:#D88B86;width:" + pctErr + "%\"></div></div></div>";
        }
        html += "</div>";

        html += "<div class=\"catalog-item\" style=\"margin-top:20px;padding:24px\">";
        html += "<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px\">";
        html += "<h2 style=\"margin:0;font-size:18px\">Aufgaben zum Nachlesen (" + missed.length + ")</h2>";
        if (missed.length > 0) {
          html += "<button type=\"button\" class=\"btn-primary\" id=\"practiceMistakesBtn\">Fehler wiederholen &rarr;</button>";
        }
        html += "</div>";
        if (missed.length === 0) {
          html += "<p style=\"margin-top:14px;font-size:14px;color:var(--text-muted)\">" + (o.answered === 0 ? "Beantworte zuerst einige Aufgaben im Quiz." : "Stark! Aktuell keine falsch beantworteten Aufgaben.") + "</p>";
        } else {
          for (var m = 0; m < missed.length; m++) {
            var mq = missed[m];
            var mr = state.answers[mq.id];
            html += "<div style=\"padding:14px 0;border-top:1px solid #ECE4D7;margin-top:12px\">";
            html += "<div class=\"meta-row\"><span><strong class=\"mono\">Aufgabe " + mq.id + "</strong> &middot; " + esc(mq.category) + " &middot; <span style=\"color:var(--err-text)\">Gewählt: " + mr.selected + " / Lösung: " + mq.correctOption + "</span></span><button type=\"button\" class=\"retry-link\" data-jump-q=\"" + mq.id + "\">Erneut lösen</button></div>";
            html += "<p style=\"margin:6px 0;font-size:14px;font-weight:600\">" + esc(mq.scenario) + "</p>";
            html += "<p style=\"margin:0;font-size:14px;color:var(--text-muted)\"><strong style=\"color:var(--ok-text)\">Richtig (" + mq.correctOption + "): </strong>" + esc(mq.options[mq.correctOption]) + " &mdash; " + esc(mq.explanation) + "</p>";
            html += "</div>";
          }
        }
        html += "</div>";
        return html;
      }

      function render() {
        syncNav();
        var root = document.getElementById("appRoot");
        if (state.view === "quiz") root.innerHTML = renderQuiz();
        else if (state.view === "platforms") root.innerHTML = renderPlatforms();
        else if (state.view === "catalog") root.innerHTML = renderCatalog();
        else root.innerHTML = renderResults();
        bindEvents();
      }

      function bindEvents() {
        var root = document.getElementById("appRoot");
        root.querySelectorAll("[data-mode]").forEach(function (btn) {
          btn.onclick = function () {
            var m = btn.getAttribute("data-mode");
            if (m === "all") startMode("all", "Alle", false);
            else if (m === "sprint") startMode("sprint", state.category, true);
            else startMode("mistakes", "Alle", false);
          };
        });
        root.querySelectorAll("[data-cat]").forEach(function (btn) {
          btn.onclick = function () {
            var c = btn.getAttribute("data-cat");
            startMode(c === "Alle" ? "all" : "category", c, false);
          };
        });
        var shuf = document.getElementById("shuffleBtn");
        if (shuf) shuf.onclick = function () {
          state.shuffled = !state.shuffled;
          state.questionIds = state.shuffled ? shuffle(state.questionIds) : state.questionIds.slice().sort(function (a, b) { return a - b; });
          state.currentIndex = 0;
          render();
        };
        root.querySelectorAll("[data-opt]").forEach(function (btn) {
          btn.onclick = function () {
            var qId = state.questionIds[state.currentIndex];
            var q = getQuestion(qId);
            if (!q || state.answers[qId]) return;
            var sel = btn.getAttribute("data-opt");
            state.answers[qId] = { selected: sel, isCorrect: sel === q.correctOption, answeredAt: Date.now() };
            saveAnswers(state.answers);
            render();
          };
        });
        var retry = document.getElementById("retryOneBtn");
        if (retry) retry.onclick = function () {
          delete state.answers[state.questionIds[state.currentIndex]];
          saveAnswers(state.answers);
          render();
        };
        var prev = document.getElementById("prevBtn");
        if (prev) prev.onclick = function () { if (state.currentIndex > 0) { state.currentIndex--; render(); } };
        var next = document.getElementById("nextBtn");
        if (next) next.onclick = function () { if (state.currentIndex < state.questionIds.length - 1) { state.currentIndex++; render(); } };
        var fin = document.getElementById("finishBtn");
        if (fin) fin.onclick = function () { state.view = "results"; render(); };
        var openAll = document.getElementById("openAllBtn");
        if (openAll) openAll.onclick = function () { startMode("all", "Alle", false); };
        var openRes = document.getElementById("openResBtn");
        if (openRes) openRes.onclick = function () { state.view = "results"; render(); };

        root.querySelectorAll("[data-jump-idx]").forEach(function (btn) {
          btn.onclick = function () {
            state.currentIndex = Number(btn.getAttribute("data-jump-idx"));
            render();
          };
        });
        root.querySelectorAll("[data-start-cat]").forEach(function (btn) {
          btn.onclick = function () {
            startMode("category", btn.getAttribute("data-start-cat"), false);
          };
        });
        root.querySelectorAll("[data-jump-q]").forEach(function (btn) {
          btn.onclick = function () {
            var id = Number(btn.getAttribute("data-jump-q"));
            var idx = state.questionIds.indexOf(id);
            if (idx === -1) {
              state.mode = "all"; state.category = "Alle"; state.questionIds = ALL_IDS.slice(); state.shuffled = false;
              idx = ALL_IDS.indexOf(id);
            }
            state.currentIndex = idx;
            state.view = "quiz";
            render();
          };
        });
        root.querySelectorAll("[data-expand-q]").forEach(function (btn) {
          btn.onclick = function () {
            var id = Number(btn.getAttribute("data-expand-q"));
            state.expandedIds[id] = !state.expandedIds[id];
            render();
          };
        });
        var toggleAllSol = document.getElementById("toggleAllSolBtn");
        if (toggleAllSol) toggleAllSol.onclick = function () { state.showAllSolutions = !state.showAllSolutions; render(); };
        var searchInp = document.getElementById("catSearchInput");
        if (searchInp) {
          searchInp.oninput = function (e) {
            state.catalogSearch = e.target.value;
            var pos = e.target.selectionStart;
            render();
            var again = document.getElementById("catSearchInput");
            if (again) { again.focus(); again.setSelectionRange(pos, pos); }
          };
        }
        root.querySelectorAll("[data-cstatus]").forEach(function (btn) {
          btn.onclick = function () { state.catalogStatus = btn.getAttribute("data-cstatus"); render(); };
        });
        root.querySelectorAll("[data-cplat]").forEach(function (btn) {
          btn.onclick = function () { state.catalogPlatform = btn.getAttribute("data-cplat"); render(); };
        });
        var askReset = document.getElementById("askResetBtn");
        if (askReset) askReset.onclick = function () { state.confirmReset = true; render(); };
        var cancelReset = document.getElementById("cancelResetBtn");
        if (cancelReset) cancelReset.onclick = function () { state.confirmReset = false; render(); };
        var confirmReset = document.getElementById("confirmResetBtn");
        if (confirmReset) confirmReset.onclick = function () {
          state.answers = {};
          saveAnswers({});
          state.confirmReset = false;
          startMode("all", "Alle", false);
          state.view = "results";
          render();
        };
        var pm = document.getElementById("practiceMistakesBtn");
        if (pm) pm.onclick = function () { startMode("mistakes", "Alle", false); };
      }

      document.getElementById("brandBtn").onclick = function () { state.view = "quiz"; render(); };
      document.getElementById("sprintBtn").onclick = function () { startMode("sprint", "Alle", true); };
      document.querySelectorAll(".nav-btn[data-view]").forEach(function (btn) {
        btn.onclick = function () { state.view = btn.getAttribute("data-view"); render(); };
      });

      document.addEventListener("keydown", function (e) {
        if (state.view !== "quiz") return;
        var tag = e.target && e.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        var qId = state.questionIds[state.currentIndex];
        var q = qId ? getQuestion(qId) : null;
        if (!q) return;
        var rec = state.answers[qId];
        var k = e.key.toLowerCase();
        if (!rec && (k === "a" || k === "1" || k === "b" || k === "2" || k === "c" || k === "3")) {
          e.preventDefault();
          var opt = (k === "a" || k === "1") ? "A" : (k === "b" || k === "2") ? "B" : "C";
          state.answers[qId] = { selected: opt, isCorrect: opt === q.correctOption, answeredAt: Date.now() };
          saveAnswers(state.answers);
          render();
          return;
        }
        if ((e.key === "ArrowRight" || (e.key === "Enter" && rec)) && state.currentIndex < state.questionIds.length - 1) {
          e.preventDefault(); state.currentIndex++; render();
        } else if (e.key === "ArrowLeft" && state.currentIndex > 0) {
          e.preventDefault(); state.currentIndex--; render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
