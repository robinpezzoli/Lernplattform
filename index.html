
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 Hirntraining 🧠</title>

    <style>
        :root {
            --forest: #47745a;
            --deep: #315d45;
            --sage: #91b89b;
            --mint: #dcefe1;
            --pastel: #edf7ee;
            --cream: #fffdf5;
            --text: #284b38;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--pastel);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 35px 20px 20px;
            position: relative;
            z-index: 2;
        }

        h1 {
            color: var(--deep);
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .bereich {
            background: rgba(255, 253, 245, 0.94);
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 18px rgba(40, 75, 56, 0.09);
        }

        .bereich h2 {
            color: var(--deep);
            margin-top: 0;
            font-size: 1.6rem;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 15px;
        }

        .app-card {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 85px;
            padding: 18px;
            background: var(--mint);
            border: 2px solid transparent;
            border-radius: 16px;
            color: var(--deep);
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s, border-color 0.2s;
        }

        .app-card:hover {
            transform: translateY(-4px);
            background: #cce6d3;
            border-color: var(--sage);
        }

        .app-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .app-title {
            font-size: 1.05rem;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--deep);
            position: relative;
            z-index: 2;
        }

        /* Lehrpersonen-Login */
        .lehrpersonen-button {
            position: fixed;
            right: 18px;
            top: 18px;
            z-index: 10;
            background: var(--deep);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .lehrpersonen-button:hover {
            background: var(--forest);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 20;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-inhalt {
            background: var(--cream);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .modal-inhalt h2 {
            margin-top: 0;
            color: var(--deep);
        }

        .modal-inhalt input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--sage);
            border-radius: 9px;
            margin: 10px 0;
            font-size: 1rem;
        }

        .modal-inhalt button {
            padding: 11px 16px;
            border: none;
            border-radius: 9px;
            background: var(--deep);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-inhalt button:hover {
            background: var(--forest);
        }

        .fehler {
            color: #b3261e;
            min-height: 20px;
            font-size: 0.9rem;
        }

        /* Ziegenwiese im Hintergrund */
        #ziegenWiese {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            opacity: 0.42;
        }

        .ziege {
            position: absolute;
            font-size: 2.5rem;
            line-height: 1;
            transition: left 60s linear, top 60s linear;
            transform-origin: center;
            will-change: left, top;
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.12));
        }

        .ziege.geht {
            animation: laufen 4s infinite alternate;
        }

        .ziege.frisst {
            animation: kauen 3s infinite alternate;
        }

        @keyframes laufen {
            from {
                margin-top: 0;
            }
            to {
                margin-top: -3px;
            }
        }

        @keyframes kauen {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.04);
            }
        }

        .pflanze {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.8;
            transition: opacity 0.5s;
        }

        @media (max-width: 600px) {
            header {
                padding-top: 75px;
            }

            .bereich {
                padding: 18px;
            }

            .app-grid {
                grid-template-columns: 1fr;
            }

            .lehrpersonen-button {
                right: 12px;
                top: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="ziegenWiese"></div>

    <button class="lehrpersonen-button" onclick="zeigeLogin()">
        👩‍🏫 Lehrpersonen
    </button>

    <header>
        <h1>💡 Hirntraining 🧠</h1>
        <p>Entdecken, üben und spielerisch lernen!</p>
    </header>

    <main>

        <!-- MATHE -->
        <section class="bereich">
            <h2>🔢 Mathe</h2>

            <div class="app-grid">

                <a href="ufo-escape-html.html" class="app-card">
                    <span class="app-icon">🛸</span>
                    <span class="app-title">UFO Escape</span>
                </a>

            </div>
        </section>

        <!-- RZG -->
        <section class="bereich">
            <h2>🌍 RZG</h2>

            <div class="app-grid">
                <!-- Weitere RZG-Spiele können hier ergänzt werden -->
            </div>
        </section>

        <!-- MEDIEN & INFORMATIK -->
        <section class="bereich">
            <h2>💻 Medien & Informatik</h2>

            <div class="app-grid">

                <a href="netiquette.html" class="app-card">
                    <span class="app-icon">💬</span>
                    <span class="app-title">Netiquette</span>
                </a>

                <a href="urheberrecht.html" class="app-card">
                    <span class="app-icon">©️</span>
                    <span class="app-title">Urheberrecht</span>
                </a>

                <a href="internet_game.html" class="app-card">
                    <span class="app-icon">🌐</span>
                    <span class="app-title">Internet Game</span>
                </a>

            </div>
        </section>

    </main>

    <footer>
        🌱 Viel Spass beim Lernen! 🐐
    </footer>

    <!-- LOGIN-MODAL -->
    <div class="modal" id="loginModal">
        <div class="modal-inhalt">
            <h2>👩‍🏫 Lehrpersonen-Login</h2>
            <p>Bitte Passwort eingeben:</p>

            <input
                type="password"
                id="passwort"
                placeholder="Passwort"
                onkeydown="if(event.key === 'Enter') pruefePasswort()"
            >

            <p class="fehler" id="loginFehler"></p>

            <button onclick="pruefePasswort()">Einloggen</button>
            <button onclick="schliesseLogin()" style="background:#888; margin-left:5px;">
                Abbrechen
            </button>
        </div>
    </div>

    <script>
        /* Lehrpersonen-Login */

        function zeigeLogin() {
            document.getElementById("loginModal").style.display = "flex";
            document.getElementById("passwort").focus();
        }

        function schliesseLogin() {
            document.getElementById("loginModal").style.display = "none";
            document.getElementById("passwort").value = "";
            document.getElementById("loginFehler").textContent = "";
        }

        function pruefePasswort() {
            const passwort = document.getElementById("passwort").value;

            if (passwort === "fedpol") {
                window.location.href = "index_lp.html";
            } else {
                document.getElementById("loginFehler").textContent =
                    "Das Passwort ist leider falsch.";
            }
        }

        /* Ziegenwiese */

        const wiese = document.getElementById("ziegenWiese");

        const pflanzen = [];
        const ziegen = [];

        const ZIEGEN_PIXEL_PRO_MINUTE = 40;

        function erstellePflanzen() {
            const symbole = ["🌱", "🌿", "☘️", "🌼"];

            for (let i = 0; i < 12; i++) {
                const pflanze = document.createElement("div");

                pflanze.className = "pflanze";
                pflanze.textContent =
                    symbole[Math.floor(Math.random() * symbole.length)];

                pflanze.style.left =
                    Math.random() * (window.innerWidth - 40) + "px";

                pflanze.style.top =
                    Math.random() * (window.innerHeight - 40) + "px";

                wiese.appendChild(pflanze);

                pflanzen.push({
                    element: pflanze,
                    x: parseFloat(pflanze.style.left),
                    y: parseFloat(pflanze.style.top),
                    verfuegbar: true
                });
            }
        }

        function erstelleZiegen() {
            for (let i = 0; i < 2; i++) {
                const ziege = document.createElement("div");

                ziege.className = "ziege";
                ziege.textContent = "🐐";

                const x = Math.random() * (window.innerWidth - 60);
                const y = Math.random() * (window.innerHeight - 60);

                ziege.style.left = x + "px";
                ziege.style.top = y + "px";

                wiese.appendChild(ziege);

                ziegen.push({
                    element: ziege,
                    x: x,
                    y: y
                });
            }
        }

        function bewegeZiege(ziege, x, y) {
            const element = ziege.element;

            element.classList.remove("frisst");
            element.classList.add("geht");

            const dx = x - ziege.x;
            const dy = y - ziege.y;

            const entfernung = Math.hypot(dx, dy);

            const dauer = Math.max(
                1000,
                entfernung / ZIEGEN_PIXEL_PRO_MINUTE * 60000
            );

            element.style.transform =
                dx >= 0 ? "scaleX(1)" : "scaleX(-1)";

            element.style.transition =
                `left ${dauer}ms linear, top ${dauer}ms linear`;

            requestAnimationFrame(() => {
                element.style.left = x + "px";
                element.style.top = y + "px";
            });

            ziege.x = x;
            ziege.y = y;

            return dauer;
        }

        function findePflanze() {
            const verfuegbarePflanzen =
                pflanzen.filter(p => p.verfuegbar);

            if (verfuegbarePflanzen.length === 0) {
                return null;
            }

            return verfuegbarePflanzen[
                Math.floor(Math.random() * verfuegbarePflanzen.length)
            ];
        }

        function lasseZiegeFressen(ziege, pflanze) {
            ziege.element.classList.remove("geht");
            ziege.element.classList.add("frisst");

            pflanze.verfuegbar = false;
            pflanze.element.style.opacity = "0.15";

            const fressdauer = 10000 + Math.random() * 10000;

            setTimeout(() => {
                ziege.element.classList.remove("frisst");
                pflanze.element.style.opacity = "0.8";
                pflanze.verfuegbar = true;

                planeNaechsteBewegung(ziege);
            }, fressdauer);
        }

        function planeNaechsteBewegung(ziege) {
            const pflanze = findePflanze();

            let zielX;
            let zielY;

            if (pflanze) {
                zielX = pflanze.x;
                zielY = pflanze.y;
            } else {
                zielX = Math.random() * (window.innerWidth - 60);
                zielY = Math.random() * (window.innerHeight - 60);
            }

            const dauer = bewegeZiege(ziege, zielX, zielY);

            setTimeout(() => {
                if (pflanze) {
                    lasseZiegeFressen(ziege, pflanze);
                } else {
                    planeNaechsteBewegung(ziege);
                }
            }, dauer);
        }

        function starteZiegenWiese() {
            erstellePflanzen();
            erstelleZiegen();

            ziegen.forEach((ziege, index) => {
                setTimeout(() => {
                    planeNaechsteBewegung(ziege);
                }, index * 3000);
            });
        }

        starteZiegenWiese();

        /* Bei Fenstergrössenänderung Pflanzen neu verteilen */

        window.addEventListener("resize", () => {
            pflanzen.forEach(pflanze => {
                pflanze.x = Math.random() * (window.innerWidth - 40);
                pflanze.y = Math.random() * (window.innerHeight - 40);

                pflanze.element.style.left = pflanze.x + "px";
                pflanze.element.style.top = pflanze.y + "px";
            });
        });
    </script>

</body>
</html>
