<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detailhandel Kassen-Trainer Schweiz (CHF) - Offline Version</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --card-sub: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --red: #dc2626;
      --red-hover: #ef4444;
      --gold: #f59e0b;
      --green: #10b981;
      --blue: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #0f172a; border-bottom: 1px solid var(--border); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
    .header-content { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .flag { width: 36px; height: 36px; background: var(--red); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
    .title-box h1 { font-size: 16px; font-weight: 700; color: #fff; }
    .title-box p { font-size: 12px; color: var(--text-muted); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .badge-streak { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--gold); color: var(--gold); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; }
    .btn { background: var(--card-sub); color: #fff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn:hover { background: #334155; }
    .btn-red { background: var(--red); border-color: var(--red); }
    .btn-red:hover { background: var(--red-hover); }
    .btn-green { background: var(--green); border-color: var(--green); }
    
    .nav-tabs { max-width: 1200px; margin: 0 auto; display: flex; gap: 6px; padding: 10px 20px 0; overflow-x: auto; }
    .tab-btn { background: transparent; color: var(--text-muted); border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--red); color: #fff; box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
    
    main { max-width: 1200px; margin: 0 auto; padding: 20px; flex: 1; width: 100%; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1.6fr; gap: 20px; }
    @media(max-width: 850px) { .grid-2 { grid-template-columns: 1fr; } }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .receipt { background: #f8fafc; color: #0f172a; border-radius: 12px; padding: 18px; font-family: "Courier New", monospace; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .receipt-header { text-align: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 12px; }
    .receipt-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .receipt-total { border-top: 2px solid #0f172a; margin-top: 10px; padding-top: 10px; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; }
    
    .given-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }
    .big-num { font-size: 22px; font-weight: 800; color: var(--gold); font-family: monospace; }
    
    .drawer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 12px; }
    .money-btn { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; transition: transform 0.1s, background 0.2s; color: #fff; user-select: none; }
    .money-btn:active { transform: scale(0.95); }
    .money-btn:hover { background: #2d3e56; }
    .coin-gold { border-color: #f59e0b; color: #fbbf24; }
    .coin-silver { border-color: #cbd5e1; color: #e2e8f0; }
    .note-chf { border-left: 4px solid var(--red); }
    
    .selected-tray { background: #0f172a; border: 2px dashed #334155; border-radius: 12px; padding: 16px; min-height: 90px; margin: 16px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tray-chip { background: #1e293b; border: 1px solid #475569; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .tray-chip:hover { border-color: var(--red); color: #f87171; }
    
    .feedback { padding: 14px; border-radius: 12px; margin-top: 14px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    .feedback-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--green); color: #34d399; }
    .feedback-error { background: rgba(220, 38, 38, 0.15); border: 1px solid var(--red); color: #f87171; }
    
    /* Speed Mode */
    .speed-container { max-width: 600px; margin: 0 auto; text-align: center; }
    .speed-math-display { font-size: 32px; font-weight: 800; font-family: monospace; margin: 24px 0; color: #fff; letter-spacing: 1px; }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 0 auto; }
    .numpad-btn { background: #1e293b; border: 1px solid #334155; border-radius: 12px; font-size: 20px; font-weight: 700; color: #fff; padding: 16px; cursor: pointer; }
    .numpad-btn:hover { background: #334155; }
    
    /* Rounding Mode */
    .rounding-table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    .rounding-table th, .rounding-table td { padding: 10px; text-align: left; border-bottom: 1px solid #1e293b; font-size: 13px; }
    .rounding-table th { background: #0f172a; color: var(--text-muted); }
    
    footer { text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid #1e293b; margin-top: auto; }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand">
      <div class="flag">🇨🇭</div>
      <div class="title-box">
        <h1>Detailhandel Kassen-Trainer Schweiz</h1>
        <p>Offline Version (CHF & 5-Rappen Rundungsregel)</p>
      </div>
    </div>
    
    <div class="header-actions">
      <div class="badge-streak" id="streakBadge">🔥 0x Serie</div>
      <button class="btn" onclick="openTheory()">📖 Kassenregeln</button>
      <button class="btn btn-red" onclick="resetStats()">🔄 Zurücksetzen</button>
    </div>
  </div>
</header>

<div class="nav-tabs">
  <button class="tab-btn active" onclick="switchTab('cashier')">🏪 Kassen-Praxis</button>
  <button class="tab-btn" onclick="switchTab('speed')">⚡ Kopfrechnen-Blitz</button>
  <button class="tab-btn" onclick="switchTab('rounding')">🎯 5-Rp. Rundung</button>
  <button class="tab-btn" onclick="switchTab('theory')">📚 Theorie & Noten</button>
</div>

<main id="mainContainer">
  <!-- Dynamic Content rendered by JavaScript below -->
</main>

<footer>
  🇨🇭 Detailhandel Kassen-Trainer • Speziell für die Schweizer Lehre (DHA / DHF) • Funktioniert 100% Offline
</footer>

<script>
// --- AUDIO SYNTHESIZER (100% Offline Web Audio API) ---
class SoundEffects {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  }
  coin() {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
    osc.frequency.exponentialRampToValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.2);
  }
  success() {
    this.init();
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.08);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.08 + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + i * 0.08);
      osc.stop(this.ctx.currentTime + i * 0.08 + 0.16);
    });
  }
  error() {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);
  }
}
const sfx = new SoundEffects();

// --- STATE MANAGEMENT ---
let currentTab = 'cashier';
let streak = parseInt(localStorage.getItem('chf_kasse_streak') || '0');
let servedCount = parseInt(localStorage.getItem('chf_kasse_served') || '0');

function updateStreakDisplay() {
  const el = document.getElementById('streakBadge');
  if (el) el.innerText = '🔥 ' + streak + 'x Serie';
  localStorage.setItem('chf_kasse_streak', streak.toString());
  localStorage.setItem('chf_kasse_served', servedCount.toString());
}

function resetStats() {
  if (confirm('Möchtest du deine Punkte und Serie wirklich zurücksetzen?')) {
    streak = 0;
    servedCount = 0;
    updateStreakDisplay();
    renderCurrentTab();
  }
}

// --- ROUNDING HELPER (Swiss 5-Rappen Rule) ---
function roundTo5Rappen(amount) {
  return Math.round(amount * 20) / 20;
}
function formatCHF(val) {
  return 'CHF ' + (Math.round(val * 100) / 100).toFixed(2);
}

// --- CHF DENOMINATIONS ---
const DENOMS = [
  { id: '0.05', label: '5 Rp.', val: 0.05, type: 'coin-gold' },
  { id: '0.10', label: '10 Rp.', val: 0.10, type: 'coin-silver' },
  { id: '0.20', label: '20 Rp.', val: 0.20, type: 'coin-silver' },
  { id: '0.50', label: '½ Fr.', val: 0.50, type: 'coin-silver' },
  { id: '1.00', label: '1 Fr.', val: 1.00, type: 'coin-silver' },
  { id: '2.00', label: '2 Fr.', val: 2.00, type: 'coin-silver' },
  { id: '5.00', label: '5 Fr. (Fünfliber)', val: 5.00, type: 'coin-silver' },
  { id: '10.00', label: '10 CHF Note', val: 10.00, type: 'note-chf' },
  { id: '20.00', label: '20 CHF Note', val: 20.00, type: 'note-chf' },
  { id: '50.00', label: '50 CHF Note', val: 50.00, type: 'note-chf' },
  { id: '100.00', label: '100 CHF Note', val: 100.00, type: 'note-chf' }
];

// --- CASHIER SCENARIO GENERATOR ---
let currentScenario = null;
let selectedMoney = {}; // { '0.05': count }
let cashierFeedback = null;

const ITEMS_DB = [
  { name: '1x Ruchbrot 500g', price: 2.40 },
  { name: '1x Pastmilch 1L', price: 1.85 },
  { name: '1x Emmentaler AOP', price: 4.65 },
  { name: '2x Gipfeli', price: 3.20 },
  { name: '1x Tafel Schokolade', price: 2.70 },
  { name: '1x Bio Eier 6er', price: 4.30 },
  { name: '1x Rivella Rot 500ml', price: 1.95 },
  { name: '1x Bündnerfleisch', price: 6.80 }
];

function generateNewCashierScenario() {
  selectedMoney = {};
  cashierFeedback = null;
  
  // Pick 2-4 items
  const count = Math.floor(Math.random() * 3) + 2;
  const items = [];
  let rawTotal = 0;
  for (let i = 0; i < count; i++) {
    const it = ITEMS_DB[Math.floor(Math.random() * ITEMS_DB.length)];
    items.push(it);
    rawTotal += it.price;
  }
  const total = roundTo5Rappen(rawTotal);
  
  // Choose customer payment
  const noteOptions = [5, 10, 20, 50, 100].filter(n => n >= total);
  const givenBase = noteOptions.length > 0 ? noteOptions[Math.floor(Math.random() * Math.min(noteOptions.length, 3))] : Math.ceil(total / 10) * 10;
  
  // 30% chance customer adds small change (e.g. Total 13.65, customer gives 20 + 0.65)
  let given = givenBase;
  const rappenPart = Math.round((total % 1) * 100) / 100;
  if (Math.random() < 0.35 && rappenPart > 0 && givenBase > total) {
    given = givenBase + rappenPart;
  }
  given = roundTo5Rappen(given);
  
  const changeDue = roundTo5Rappen(given - total);
  currentScenario = { items, total, given, changeDue };
  renderCashierMode();
}

function addCashierMoney(id) {
  sfx.coin();
  selectedMoney[id] = (selectedMoney[id] || 0) + 1;
  renderCashierMode();
}

function removeCashierMoney(id) {
  if (selectedMoney[id] > 0) {
    selectedMoney[id]--;
    if (selectedMoney[id] === 0) delete selectedMoney[id];
    renderCashierMode();
  }
}

function getSelectedTotal() {
  let sum = 0;
  for (const [id, count] of Object.entries(selectedMoney)) {
    sum += parseFloat(id) * count;
  }
  return roundTo5Rappen(sum);
}

function submitCashierChange() {
  const selectedSum = getSelectedTotal();
  const diff = Math.abs(selectedSum - currentScenario.changeDue);
  
  if (diff < 0.01) {
    sfx.success();
    streak++;
    servedCount++;
    cashierFeedback = {
      success: true,
      text: 'Perfekt! Exakt ' + formatCHF(currentScenario.changeDue) + ' Rückgeld herausgegeben.'
    };
  } else {
    sfx.error();
    streak = 0;
    cashierFeedback = {
      success: false,
      text: 'Leider falsch! Du hast ' + formatCHF(selectedSum) + ' gewählt. Richtig wäre: ' + formatCHF(currentScenario.changeDue)
    };
  }
  updateStreakDisplay();
  renderCashierMode();
}

function renderCashierMode() {
  if (!currentScenario) {
    generateNewCashierScenario();
    return;
  }
  
  const container = document.getElementById('mainContainer');
  const selectedSum = getSelectedTotal();
  
  let receiptItemsHtml = currentScenario.items.map(it => 
    '<div class="receipt-item"><span>' + it.name + '</span><span>' + formatCHF(it.price) + '</span></div>'
  ).join('');

  let trayChipsHtml = '';
  for (const [id, count] of Object.entries(selectedMoney)) {
    const denom = DENOMS.find(d => d.id === id);
    if (denom && count > 0) {
      trayChipsHtml += '<div class="tray-chip" onclick="removeCashierMoney(\'' + id + '\')">' + count + 'x ' + denom.label + ' ✕</div>';
    }
  }
  if (!trayChipsHtml) {
    trayChipsHtml = '<span style="color: var(--text-muted); font-size: 13px;">Klicke auf die Münzen/Noten unten, um Rückgeld herauszugeben...</span>';
  }

  let drawerBtnsHtml = DENOMS.map(d => 
    '<div class="money-btn ' + d.type + '" onclick="addCashierMoney(\'' + d.id + '\')"><div style="font-size:15px; font-weight:bold;">' + d.label + '</div><div style="font-size:10px; color:var(--text-muted); margin-top:2px;">+ hinzufügen</div></div>'
  ).join('');

  let feedbackHtml = '';
  if (cashierFeedback) {
    const cls = cashierFeedback.success ? 'feedback-success' : 'feedback-error';
    feedbackHtml = '<div class="feedback ' + cls + '"><span>' + cashierFeedback.text + '</span><button class="btn btn-red" onclick="generateNewCashierScenario()">Nächster Kunde ➔</button></div>';
  }

  container.innerHTML = `
    <div class="grid-2">
      <!-- Left Column: Receipt & Payment Info -->
      <div>
        <div class="card">
          <div class="receipt">
            <div class="receipt-header">
              <h3 style="font-size:14px; font-weight:bold;">DETAILHANDEL FILIALE</h3>
              <p style="font-size:11px; color:#64748b;">Kassenbon #${servedCount + 1}</p>
            </div>
            ${receiptItemsHtml}
            <div class="receipt-total">
              <span>TOTAL (CHF):</span>
              <span>${formatCHF(currentScenario.total)}</span>
            </div>
          </div>

          <div class="given-box">
            <div>
              <span style="font-size:11px; color:var(--text-muted); display:block;">VOM KUNDEN GEGEBEN</span>
              <span class="big-num">${formatCHF(currentScenario.given)}</span>
            </div>
            <div style="text-align:right;">
              <span style="font-size:11px; color:var(--text-muted); display:block;">RECHNUNGSBETRAG</span>
              <span style="font-size:16px; font-weight:bold; color:#fff;">${formatCHF(currentScenario.total)}</span>
            </div>
          </div>

          <div style="margin-top: 14px; font-size: 12px; color: var(--text-muted); background: #0f172a; padding: 10px; border-radius: 8px;">
            💡 <strong>Aufzähl-Tipp:</strong> Zähle laut von ${formatCHF(currentScenario.total)} bis ${formatCHF(currentScenario.given)} hoch!
          </div>
        </div>
      </div>

      <!-- Right Column: Register Drawer & Output Tray -->
      <div>
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="font-size:16px; font-weight:bold;">Rückgeld-Ablage</h3>
            <span style="font-size:16px; font-weight:bold; color:var(--gold); font-family:monospace;">
              Gewählt: ${formatCHF(selectedSum)}
            </span>
          </div>

          <div class="selected-tray">
            ${trayChipsHtml}
          </div>

          <div style="display:flex; gap:10px; margin-bottom:16px;">
            <button class="btn btn-green" style="flex:1; justify-content:center; padding:12px;" onclick="submitCashierChange()" ${cashierFeedback ? 'disabled' : ''}>
              ✅ Rückgeld übergeben (ENTER)
            </button>
            <button class="btn" onclick="selectedMoney={}; renderCashierMode();">
              🗑️ Leeren
            </button>
          </div>

          ${feedbackHtml}

          <h4 style="font-size:12px; color:var(--text-muted); text-transform:uppercase; margin-top:20px; letter-spacing:0.5px;">
            Schweizer Kassenschublade (CHF)
          </h4>
          <div class="drawer-grid">
            ${drawerBtnsHtml}
          </div>
        </div>
      </div>
    </div>
  `;
}

// --- SPEED MATH MODE ---
let speedQuestion = null;
let speedInput = '';
let speedScore = 0;

function generateSpeedQuestion() {
  speedInput = '';
  const total = roundTo5Rappen(Math.floor(Math.random() * 4500 + 200) / 100);
  const possibleNotes = [5, 10, 20, 50, 100].filter(n => n >= total);
  const given = possibleNotes.length > 0 ? possibleNotes[0] : Math.ceil(total / 10) * 10;
  const answer = roundTo5Rappen(given - total);
  speedQuestion = { total, given, answer };
  renderSpeedMode();
}

function handleSpeedNumpad(val) {
  sfx.coin();
  if (val === 'C') {
    speedInput = '';
  } else if (val === '.') {
    if (!speedInput.includes('.')) speedInput += '.';
  } else {
    speedInput += val;
  }
  renderSpeedMode();
}

function submitSpeedAnswer() {
  const num = parseFloat(speedInput);
  if (isNaN(num)) return;
  
  if (Math.abs(num - speedQuestion.answer) < 0.01) {
    sfx.success();
    speedScore += 10;
    streak++;
  } else {
    sfx.error();
    streak = 0;
    alert('Falsch! Total war: ' + formatCHF(speedQuestion.total) + ', gegeben: ' + formatCHF(speedQuestion.given) + '. Richtiges Wechselgeld: ' + formatCHF(speedQuestion.answer));
  }
  updateStreakDisplay();
  generateSpeedQuestion();
}

function renderSpeedMode() {
  if (!speedQuestion) {
    generateSpeedQuestion();
    return;
  }
  const container = document.getElementById('mainContainer');
  container.innerHTML = `
    <div class="card speed-container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="font-size:12px; color:var(--text-muted); font-weight:bold;">KOPFRECHNEN-BLITZ</span>
        <span style="color:var(--gold); font-weight:bold; font-size:14px;">Punkte: ${speedScore}</span>
      </div>

      <div style="background:#0f172a; padding:16px; border-radius:12px; border:1px solid #1e293b;">
        <div style="font-size:13px; color:var(--text-muted);">Rechnung: <strong>${formatCHF(speedQuestion.total)}</strong> • Gegeben: <strong>${formatCHF(speedQuestion.given)}</strong></div>
        <div class="speed-math-display">Rückgeld: ${formatCHF(speedQuestion.given)} - ${formatCHF(speedQuestion.total)} = ?</div>
      </div>

      <div style="margin:20px 0; font-size:24px; font-weight:bold; font-family:monospace; background:#0f172a; padding:12px; border-radius:8px; border:1px solid #334155; color:var(--blue);">
        ${speedInput || '0.00'} CHF
      </div>

      <div class="numpad">
        <button class="numpad-btn" onclick="handleSpeedNumpad('7')">7</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('8')">8</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('9')">9</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('4')">4</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('5')">5</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('6')">6</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('1')">1</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('2')">2</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('3')">3</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('C')">C</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('0')">0</button>
        <button class="numpad-btn" onclick="handleSpeedNumpad('.')">.</button>
      </div>

      <button class="btn btn-green" style="width:100%; max-width:320px; margin-top:14px; padding:14px; font-size:15px; justify-content:center;" onclick="submitSpeedAnswer()">
        Prüfen (ENTER)
      </button>
    </div>
  `;
}

// --- ROUNDING DRILL MODE ---
let roundingVal = 0;
let roundingTarget = 0;

function generateRoundingQuestion() {
  const base = (Math.floor(Math.random() * 800) + 100) / 100;
  roundingVal = parseFloat(base.toFixed(2));
  roundingTarget = roundTo5Rappen(roundingVal);
  renderRoundingMode();
}

function checkRoundingAnswer(userRounded) {
  if (Math.abs(userRounded - roundingTarget) < 0.001) {
    sfx.success();
    streak++;
    alert('Richtig! ' + roundingVal.toFixed(2) + ' CHF rundet auf ' + roundingTarget.toFixed(2) + ' CHF.');
  } else {
    sfx.error();
    streak = 0;
    alert('Falsch! ' + roundingVal.toFixed(2) + ' CHF rundet auf ' + roundingTarget.toFixed(2) + ' CHF.');
  }
  updateStreakDisplay();
  generateRoundingQuestion();
}

function renderRoundingMode() {
  if (!roundingVal) {
    generateRoundingQuestion();
    return;
  }
  const container = document.getElementById('mainContainer');
  const lower0 = Math.floor(roundingVal * 10) / 10;
  const mid5 = lower0 + 0.05;
  const upper0 = lower0 + 0.10;

  const choices = Array.from(new Set([lower0, mid5, upper0].map(v => parseFloat(v.toFixed(2)))));

  let btnsHtml = choices.map(c => 
    '<button class="btn" style="font-size:18px; padding:16px 24px; font-family:monospace; justify-content:center;" onclick="checkRoundingAnswer(' + c + ')">' + formatCHF(c) + '</button>'
  ).join('');

  container.innerHTML = `
    <div class="card speed-container">
      <h3 style="font-size:16px; font-weight:bold; margin-bottom:6px;">5-Rappen-Rundungsdrill (Schweiz)</h3>
      <p style="font-size:12px; color:var(--text-muted);">Wie lautet der gerundete Barzahlungsbetrag an der Schweizer Kasse?</p>

      <div style="background:#0f172a; border:2px solid var(--red); border-radius:16px; padding:24px; margin:24px 0;">
        <span style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Unbearbeiteter Betrag</span>
        <div style="font-size:38px; font-weight:900; color:var(--gold); font-family:monospace; margin-top:6px;">
          ${formatCHF(roundingVal)}
        </div>
      </div>

      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:12px; margin-bottom:20px;">
        ${btnsHtml}
      </div>

      <div style="text-align:left; background:#0f172a; padding:16px; border-radius:12px; border:1px solid #1e293b; font-size:12px; line-height:1.6;">
        <strong>Schweizer Rundungsregel auf 5 Rappen:</strong><br>
        • <strong>.x1 / .x2</strong> ➔ Abrunden auf .x0<br>
        • <strong>.x3 / .x4</strong> ➔ Aufrunden auf .x5<br>
        • <strong>.x6 / .x7</strong> ➔ Abrunden auf .x5<br>
        • <strong>.x8 / .x9</strong> ➔ Aufrunden auf nächste Zehnerstelle
      </div>
    </div>
  `;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  renderCurrentTab();
}

function openTheory() {
  switchTab('theory');
}

function renderCurrentTab() {
  if (currentTab === 'cashier') renderCashierMode();
  else if (currentTab === 'speed') renderSpeedMode();
  else if (currentTab === 'rounding') renderRoundingMode();
  else if (currentTab === 'theory') renderTheoryMode();
}

// Global Keyboard Handler (Enter to submit)
window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (currentTab === 'cashier') {
      if (cashierFeedback) generateNewCashierScenario();
      else submitCashierChange();
    } else if (currentTab === 'speed') {
      submitSpeedAnswer();
    }
  }
});

// Init on load
updateStreakDisplay();
renderCashierMode();
</script>
</body>
